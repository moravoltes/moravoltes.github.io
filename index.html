<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mora Voltés · Senior Product Designer</title>
<meta name="description" content="Mora Voltés, Senior Product Designer especializada en checkout y pagos, con más de 15 años en diseño gráfico.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A; --lime:#D0FB80; --wine:#941248;
  --font:"Geist", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter:clamp(1rem, 2.4vw, 2rem);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:var(--font);font-size:1.125rem;line-height:1.45;letter-spacing:.002em;font-weight:450;-webkit-font-smoothing:antialiased}
::selection{background:var(--lime);color:var(--ink)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.04;letter-spacing:-.032em;text-wrap:balance}
p{margin:0;max-width:62ch}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.skip{position:fixed;left:1rem;top:-5rem;z-index:200;background:var(--ink);color:#fff;padding:.75rem 1rem;text-decoration:none}
.skip:focus{top:1rem}
.mono{font-family:var(--mono);font-size:.875rem;letter-spacing:0;line-height:1.4}
.muted{color:var(--zmuted)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Zonas: cada sección define su fondo y sus colores ---- */
.zone{--zbg:#FFFFFF;--zfg:var(--ink);--zmuted:#6B6B6B;--zrule:#E2E2E0;--zline:var(--ink);--zreveal:#767676;--ztitle:var(--zfg);--zbig:var(--zfg);
  background:var(--zbg);color:var(--zfg);transition:background-color .6s var(--ease),color .6s var(--ease)}

/* ---- Nombre gigante (decorativo) y logo ---- */
.mega{position:fixed;left:var(--gutter);top:calc(var(--gutter) * .9);z-index:90;pointer-events:none;
  font-weight:600;font-size:clamp(4.5rem, 13vw, 12.5rem);line-height:.84;letter-spacing:-.044em;
  color:var(--ink);transform-origin:0 0;will-change:transform;transition:opacity .25s linear,color .6s var(--ease)}
.mega span,.mega-space span{display:block}
.mega.intro{transition:transform 1.25s var(--ease),opacity .25s linear}
.mega.gone{opacity:0}
.mega-space{color:transparent;font-weight:600;font-size:clamp(4.5rem, 13vw, 12.5rem);line-height:.84;letter-spacing:-.044em}
.logo{position:fixed;left:calc(var(--gutter) - .5rem);top:calc(var(--gutter) * .9 - .45rem);z-index:92;padding:.45rem .5rem;
  background:#FFFFFF;color:var(--ink);text-decoration:none;font-weight:600;font-size:1.0625rem;line-height:.9;letter-spacing:-.03em;
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .3s var(--ease),transform .4s var(--ease),visibility 0s linear .3s,background-color .6s}
.logo span{display:block}
.logo.show{opacity:1;visibility:visible;transform:none;transition:opacity .3s var(--ease),transform .4s var(--ease),visibility 0s,background-color .6s}

/* ---- Franja superior al scrollear ---- */
.bar{position:fixed;left:0;right:0;top:0;height:calc(var(--gutter) * 1.8 + 44px);background:#FFFFFF;border-bottom:1px solid #E2E2E0;z-index:89;transform:translateY(-101%);transition:transform .5s var(--ease)}
.bar.on{transform:none}

/* ---- Menú + ---- */
.menu{position:fixed;right:var(--gutter);top:calc(var(--gutter) * .9);z-index:95;display:flex;align-items:center;background:var(--ink);color:#FFFFFF;transition:background-color .6s}
.menu nav{display:flex;overflow:hidden;max-width:0;visibility:hidden;transition:max-width .6s var(--ease),visibility 0s linear .6s}
.menu.open nav{max-width:420px;visibility:visible;transition:max-width .6s var(--ease),visibility 0s}
.menu nav a,.menu nav button{display:inline-flex;align-items:center;min-height:44px;padding:0 .9rem;color:inherit;text-decoration:none;font-size:.95rem;white-space:nowrap;background:none;border:0;cursor:pointer}
.menu nav a,.menu nav button{transition:background-color .25s var(--ease),color .25s var(--ease)}
.menu nav a:hover,.menu nav button:hover,.menu nav a:active,.menu nav button:active,.menu nav a:focus-visible,.menu nav button:focus-visible{background:#D0FB80;color:#0A0A0A}
.menu-toggle{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:inherit}
.burger{position:relative;width:18px;height:14px;display:block}
.burger i{position:absolute;left:0;width:18px;height:2px;background:currentColor;transform-origin:0 50%;transition:transform .45s var(--ease),opacity .25s var(--ease)}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){top:6px}
.burger i:nth-child(3){top:12px}
.menu.open .burger i:nth-child(1){transform:rotate(41.8deg)}
.menu.open .burger i:nth-child(2){opacity:0;transform:scaleX(.2)}
.menu.open .burger i:nth-child(3){transform:rotate(-41.8deg)}
@media (max-width:899px){
  .menu{flex-direction:column;align-items:stretch;background:none}
  .menu-toggle{order:-1;align-self:flex-end;background:var(--ink)}
  .menu nav{flex-direction:column;max-width:none;max-height:0;background:var(--ink);transition:max-height .5s var(--ease),visibility 0s linear .5s}
  .menu.open nav{max-width:none;max-height:10rem;transition:max-height .5s var(--ease),visibility 0s}
  .menu nav a,.menu nav button{min-height:48px;justify-content:flex-end;padding:0 1rem 0 1.5rem}
}

.subh{font-size:1.25rem;letter-spacing:-.025em;margin-top:.5rem}
.quotes{display:grid;gap:1rem 2rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.quotes blockquote{margin:0;border-top:1px solid var(--zrule);padding-top:.9rem;display:grid;gap:.4rem}
.quotes p{font-size:1.25rem;letter-spacing:-.02em;line-height:1.3}
.quotes cite{font-style:normal;color:var(--zmuted)}
.next-link{display:grid;gap:.75rem;text-decoration:none;color:inherit}
.next-link .t{color:var(--zfg)!important;transition:transform .6s var(--ease)}
.next-link:hover .t,.next-link:focus-visible .t{transform:translateX(.3rem)}

/* ---- Acento #D0FB80: bloque solo detrás de la palabra, desfasado a la izquierda y arriba, texto negro.
   La flecha y la línea de abajo quedan fuera del bloque; la flecha se mueve 3 px en su dirección ---- */
.acc{display:inline-flex;align-items:center;gap:.45em;min-height:44px;text-decoration:none;color:inherit;border-bottom:2px solid currentColor;justify-self:start;align-self:start}
.acc-t{position:relative;isolation:isolate;transition:color .35s var(--ease)}
.acc-t::before{content:"";position:absolute;z-index:-1;left:-.35em;right:.05em;top:-.2em;bottom:.12em;background:var(--lime);clip-path:inset(0 100% 0 0);transition:clip-path .35s var(--ease)}
.acc-a{display:inline-block;transition:transform .35s var(--ease)}
.acc:hover .acc-t::before,.acc:active .acc-t::before,.acc:focus-visible .acc-t::before,
.gbanner:hover .acc-t::before,.gbanner:focus-visible .acc-t::before{clip-path:inset(0)}
.acc:hover .acc-t,.acc:active .acc-t,.acc:focus-visible .acc-t,
.gbanner:hover .acc-t,.gbanner:focus-visible .acc-t{color:#0A0A0A}
.acc:hover .a-dn,.acc:active .a-dn,.acc:focus-visible .a-dn{transform:translateY(3px)}
.acc:hover .a-ne,.acc:active .a-ne,.acc:focus-visible .a-ne,.gbanner:hover .a-ne,.gbanner:focus-visible .a-ne{transform:translate(3px,-3px)}
.acc:hover .a-l,.acc:active .a-l,.acc:focus-visible .a-l{transform:translateX(-3px)}
.acc:focus-visible{outline:2px solid currentColor;outline-offset:4px}

/* ---- Vistas y revelado ---- */
main{display:block;outline:none}
.view{animation:viewIn .7s var(--ease) both}
@keyframes viewIn{from{opacity:.2}to{opacity:1}}
.rv{transition:transform 1s var(--ease),opacity 1s var(--ease)}
.js-motion .rv:not(.in){transform:translateY(36px);opacity:.3}

/* ---- Hero ---- */
.hero{--hero-pad:var(--gutter);display:grid;grid-template-columns:1fr;gap:var(--gutter);padding:calc(var(--gutter) * .9) var(--hero-pad) var(--gutter)}
@media (min-width:900px){.hero{--hero-pad:max(64px, var(--gutter));grid-template-columns:1fr 1fr;min-height:min(100svh, 980px)}}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:3rem}
@media (min-width:900px){.hero-left{min-height:clamp(24rem, 70svh, 52rem)}}
.hero-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:1rem 2rem}
.hero-intro p{max-width:34ch}
.hero-copy{display:grid;gap:.85rem}
.hero-loc{font-family:var(--mono);font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--zmuted)}
.hero-intro a{font-family:var(--mono);font-size:.875rem}
.portrait{position:relative;min-height:clamp(26rem, 60svh, 60rem);clip-path:inset(0 0 0 0);transition:clip-path 1.5s var(--ease) .15s}
.js-motion .portrait.start{clip-path:inset(0 0 0 96%)}

/* ---- Imagen próximamente (gris neutro hasta tener las imágenes) ---- */
.ph{position:relative;overflow:hidden;background:var(--tone,#023852);isolation:isolate}
.ph::before{content:"";position:absolute;inset:-10%;background:
  radial-gradient(60% 50% at 70% 30%, rgba(255,255,255,.16), transparent 70%),
  radial-gradient(50% 60% at 20% 80%, rgba(0,0,0,.14), transparent 70%);
  transform:scale(var(--z,1.12));transition:transform 1.2s var(--ease);z-index:-1}
.ph::after{content:"";position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;z-index:-1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ph:not(.portrait){--tone:#ECECEA!important;--tone-fg:#5E5E5E!important}
.ph .soon{position:absolute;left:1rem;bottom:.85rem;font-family:var(--mono);font-size:.8125rem;color:var(--tone-fg,#9FD8C5)}

/* ---- Statement ---- */
.statement{padding:clamp(3rem, 9vw, 7rem) var(--gutter) clamp(2.5rem, 6vw, 5rem)}
@media (max-width:899px){.statement{padding-top:clamp(6rem, 14svh, 8rem)}}
.statement p{font-size:clamp(1.75rem, 1.1rem + 2.6vw, 3.6rem);font-weight:600;line-height:1.08;letter-spacing:-.03em;max-width:28ch}
.statement .w{transition:color .35s linear}
.js-motion .statement .w{color:var(--zreveal)}
.js-motion .statement .w.on{color:var(--zfg)}

/* ---- Secciones ---- */
.label-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;padding:0 var(--gutter);margin-bottom:1.25rem}
.label-row h2{font-size:1rem;letter-spacing:0;font-weight:600}
.z-work{padding-top:4rem}
.z-more,.z-exp{padding:clamp(3.5rem, 8vw, 6rem) 0}
.feature{--ts:clamp(2.4rem, 1.4rem + 4.2vw, 5.5rem);--numw:calc(var(--ts) * .57 * 1.55);display:block;text-decoration:none;color:inherit;padding:0 var(--gutter);padding-bottom:clamp(3.5rem, 8vw, 7rem)}
.feature-head{display:grid;gap:.85rem;padding:clamp(1.5rem, 2.4vw, 2rem) 0 1.25rem;border-top:2px solid var(--zline)}
.feature-sub{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem 2rem;padding-left:var(--numw)}
@media (max-width:899px){.feature-sub{flex-direction:column;align-items:flex-start}}
.feature-meta{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;color:var(--zmuted)}
.feature-title{font-size:var(--ts);display:grid;grid-template-columns:var(--numw) minmax(0,1fr);align-items:start}
/* El número se centra en el alto de la primera línea del título (1.04em), no en todo el bloque */
.feature-title .num{height:1.04em;display:flex;align-items:center}
.feature-title .num span{font-size:.57em;line-height:1;letter-spacing:-.02em;position:relative;isolation:isolate;padding-right:.08em}
.feature-title .num span::before{content:"";position:absolute;z-index:-1;left:.1em;right:-.22em;top:.02em;bottom:-.14em;background:#D0FB80;clip-path:inset(0 100% 0 0);transition:clip-path .45s var(--ease)}
a.feature:hover .num span::before,a.feature:focus-visible .num span::before,.feature.on .num span::before{clip-path:inset(0)}
a.feature:focus-visible{outline:none}
a.feature:focus-visible .feature-head{outline:2px solid #0A0A0A;outline-offset:6px}
.feature-title .arr{display:inline-block;font-weight:300;color:var(--ink);transition:transform .7s var(--ease)}
.feature-line{color:var(--zfg);font-size:clamp(1.125rem, 1rem + .4vw, 1.375rem);letter-spacing:-.01em;max-width:none}

.feature .ph{aspect-ratio:16/8;clip-path:inset(0 0 0 0);transition:clip-path 1.2s var(--ease)}
@media (max-width:700px){.feature .ph{aspect-ratio:4/3}}
.js-motion .feature .ph:not(.in){clip-path:inset(8% 6% 8% 6%)}
a.feature:hover .arr,a.feature:focus-visible .arr{transform:translateX(.18em)}
a.feature:hover .ph,a.feature:focus-visible .ph{--z:1.02}

/* Tarjeta animada de Garantía Premium: pantallas en tres columnas que se desplazan sobre el violeta de Frávega */
.feature-wrap{position:relative}
.ganim{position:relative;aspect-ratio:16/8;overflow:hidden;container-type:size;isolation:isolate;clip-path:inset(0 0 0 0);transition:clip-path 1.2s var(--ease);
  background:radial-gradient(80% 90% at 50% 40%, #861EE4 0%, #6413B5 100%);
  --h:90cqh;--g:9cqh;--cg:8cqh}
@media (max-width:700px){.ganim{aspect-ratio:4/3;--h:76cqh;--g:7cqh;--cg:6cqh}}
.js-motion .feature .ganim:not(.in){clip-path:inset(8% 6% 8% 6%)}
.ganim::after{content:"";position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;pointer-events:none;z-index:5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ganim-grid{position:absolute;inset:0;display:flex;justify-content:center;gap:var(--cg);transition:transform 1.6s var(--ease)}
.js-motion .ganim:not(.in) .ganim-grid{transform:scale(1.2)}
.ganim-col{position:relative;flex:none;height:100%;width:calc(var(--h) * .45);transform:translateY(calc(var(--base,0cqh) + var(--sy,0px)))}
.ganim-col:nth-child(odd){--base:12cqh}
.ganim-track{position:absolute;left:0;right:0;top:calc(50% - var(--h) / 2);display:flex;flex-direction:column;gap:var(--g);
  --L:calc(4 * (var(--h) + var(--g)));transform:translateY(calc(var(--L) * -1));animation:gUp 60s linear infinite;will-change:transform}
.ganim-col:nth-child(2) .ganim-track{animation-name:gDown;animation-duration:55s}
.ganim-col:nth-child(3) .ganim-track{animation-duration:64s}
@keyframes gUp  {from{transform:translateY(calc(var(--L) * -1))}to{transform:translateY(calc(var(--L) * -2))}}
@keyframes gDown{from{transform:translateY(calc(var(--L) * -1))}to{transform:translateY(0)}}
.ganim-track img{display:block;width:100%;height:var(--h);object-fit:contain;user-select:none;filter:drop-shadow(0 2cqh 3.5cqh rgba(40,0,80,.4))}
.ganim.off .ganim-track,.ganim.paused .ganim-track{animation-play-state:paused}
.ganim-pause{position:absolute;z-index:6;right:calc(var(--gutter) + .75rem);bottom:calc(clamp(3.5rem, 8vw, 7rem) + .75rem);width:44px;height:44px;display:grid;place-items:center;border:0;cursor:pointer;
  background:#0A0A0A;color:#FFFFFF;transition:background-color .25s var(--ease),color .25s var(--ease)}
/* Ícono: dos barras (pausar) o triángulo (reanudar) */
.gp-i{width:12px;height:14px;background:linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px,currentColor 8px)}
.ganim-pause[aria-pressed="true"] .gp-i{background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}
.ganim-pause:hover,.ganim-pause:focus-visible{background:var(--lime);color:#0A0A0A}
@media (prefers-reduced-motion: reduce){.ganim-pause{display:none}}
.tag{font-family:var(--mono);font-size:.8125rem;border:1px solid currentColor;padding:.1rem .45rem;white-space:nowrap;letter-spacing:0}

.list{list-style:none;margin:0;padding:0 var(--gutter)}
.list li{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:.25rem 1rem;align-items:baseline;padding:1.1rem 0;border-top:1px solid var(--zrule)}
@media (min-width:800px){.list li{grid-template-columns:3rem minmax(0,2fr) minmax(0,1fr) auto}}
.list li:last-child{border-bottom:1px solid var(--zrule)}
.list .t{font-size:clamp(1.25rem, 1rem + .8vw, 1.75rem);font-weight:600;letter-spacing:-.02em;transition:transform .6s var(--ease)}
.list .c{color:var(--zmuted)}
@media (max-width:799px){.list .c,.list .s{grid-column:2}}
.list li:hover .t{transform:translateX(.5rem)}
.preview{position:fixed;left:0;top:0;width:280px;aspect-ratio:4/3;pointer-events:none;z-index:80;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .35s var(--ease),transform .5s var(--ease)}
.preview.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.preview{display:none}}

/* Banner de diseño gráfico: acceso a Behance, distinto del listado UX.
   Referencia: texto blanco sobre franjas rojas que cruzan hacia una foto en blanco y negro con grano */
.z-graphic{--zbg:#F2F2F0;--gred:var(--wine);padding:0;margin-top:clamp(2rem, 5vw, 4rem)}
.gbanner{position:relative;display:grid;grid-template-columns:1fr;text-decoration:none;color:var(--ink,#0A0A0A);overflow:hidden;isolation:isolate}
.gbanner::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>")}
.gbanner-img{position:relative}
.gbanner .gbanner-img .ph{--tone:#5E5E5C!important;--tone-fg:#F2F2F0!important;height:100%;min-height:18rem;filter:grayscale(1)}
.gbanner-img .ph::before{background:radial-gradient(38% 55% at 55% 48%, #161616, transparent 72%)}
.gbanner-img .ph .soon{top:.85rem;bottom:auto}
.gbanner-img::after{content:"";position:absolute;right:0;bottom:0;width:clamp(4rem, 9vw, 9rem);height:clamp(4rem, 9vw, 7.5rem);background:var(--gred)}
.gbanner-text{position:relative;z-index:2;display:grid;gap:1.25rem;align-content:center;padding:0 var(--gutter) clamp(2.5rem, 6vw, 4rem);margin-top:-3.2rem}
.gbanner-label{font-family:var(--mono);font-size:.875rem;color:#4A4A48;background:#F2F2F0;padding:.15rem .45rem;justify-self:start}
.gbanner-big{margin:0;font-size:clamp(2.4rem, 1.2rem + 4.4vw, 5.6rem);font-weight:600;line-height:1.02;letter-spacing:-.04em;max-width:none}
.gbanner-big .ln{display:block;width:fit-content;color:#FFFFFF;background:linear-gradient(var(--gred),var(--gred)) no-repeat 0 0/100% 100%;padding:.02em .18em .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .9s var(--ease),color .5s linear}
.gbanner-big .ln:nth-child(2){transition-delay:.12s}
.js-motion .gbanner:not(.in) .ln{background-size:0% 100%;color:var(--ink,#0A0A0A)}
.gbanner-sub{color:#4A4A48;max-width:36ch}
.gbanner-link{font-family:var(--mono);font-size:.9375rem}
.gbanner:hover .ph,.gbanner:focus-visible .ph{--z:1.02}
@media (min-width:800px){
  .gbanner{grid-template-columns:1fr 1fr;min-height:clamp(26rem, 38vw, 38rem)}
  .gbanner-img{grid-column:2;grid-row:1}
  .gbanner-text{grid-column:1 / span 2;grid-row:1;margin-top:0;padding:clamp(2.5rem, 5vw, 4rem) var(--gutter)}
  .gbanner-big .ln:nth-child(2){min-width:calc(72vw - var(--gutter))}
}

.exp{list-style:none;margin:0;padding:0 var(--gutter)}
.exp li{display:grid;grid-template-columns:1fr;gap:.3rem 2rem;padding:1.5rem 0;border-top:1px solid var(--zrule)}
@media (min-width:800px){.exp li{grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;align-items:baseline}}
.exp .p,.exp .r{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.exp .p{color:var(--zmuted)}
.exp .r{display:block;color:var(--ink)}
.exp .rd{display:grid;gap:.5rem}
.exp .d{color:var(--zmuted);font-size:1rem;line-height:1.5}
.exp .y{color:var(--zmuted);white-space:nowrap}
@media (max-width:799px){.exp .y{margin-top:.4rem}}
.cv-row{padding:clamp(2.5rem, 6vw, 4rem) var(--gutter) 0}
.cv-row .acc{font-family:var(--mono);font-size:.875rem}

.z-contact{--zbg:#0A0A0A;--zfg:#FFFFFF;--zmuted:#A3A3A3;--zrule:#333333;--zbig:#FFFFFF}
.contact{padding:clamp(4rem, 10vw, 8rem) var(--gutter) clamp(3.5rem, 8vw, 6rem);overflow:hidden}
.contact .big{font-size:clamp(3.2rem, 11.5vw, 11.5rem);line-height:.86;letter-spacing:-.05em;font-weight:600;transform-origin:0 100%;color:var(--zbig)}
.contact ul{list-style:none;padding:0;margin:clamp(3rem, 7vw, 5.5rem) 0 0;display:grid;gap:1.5rem 2rem;grid-template-columns:1fr}
@media (min-width:900px){.contact ul{grid-template-columns:repeat(3,minmax(0,1fr))}}
.contact li{border-top:1px solid var(--zrule);padding-top:.9rem;display:grid;gap:.2rem}
.contact .k{color:var(--zmuted)}
.contact a{font-size:1rem}

.pending{font-family:var(--mono);font-size:.8125rem;background:#FFF1C2;color:#5A4300;padding:.05rem .4rem;letter-spacing:0}

/* ---- Caso ---- */
.case-top{padding:calc(var(--gutter) * 1.8 + 44px + 1.25rem) var(--gutter) 0;display:flex;gap:1rem;align-items:center}
.back{font-family:var(--mono);font-size:.875rem}
.case-hero{padding:clamp(2rem, 6vw, 4.5rem) var(--gutter) clamp(3rem, 7vw, 5rem)}
.case-hero .eyebrow{color:var(--zmuted)}
.case-hero h1{font-size:clamp(3rem, 1.6rem + 6.5vw, 9rem);line-height:.9;letter-spacing:-.045em;margin:1rem 0 1.5rem;color:var(--ztitle)}
.case-hero .lede{font-size:clamp(1.25rem, 1.05rem + .8vw, 1.75rem);line-height:1.25;letter-spacing:-.025em;color:var(--zmuted);max-width:34ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1rem 2rem;margin:clamp(2rem, 5vw, 3.5rem) 0 0;padding-top:1rem}
@media (max-width:699px){.meta{grid-template-columns:max-content minmax(0,1fr);gap:.6rem 1.5rem;align-items:baseline}.meta div{display:contents}.meta dd{margin:0}}
.meta dt{color:var(--zmuted)}
.meta dd{margin:.15rem 0 0}
.z-cover{background:linear-gradient(#FFFFFF 50%, #FFFFFF 50%)}
.case-cover{padding:0 var(--gutter)}
.case-cover .ph{aspect-ratio:16/8}
@media (max-width:700px){.case-cover .ph{aspect-ratio:4/3}}
.summary{display:grid;grid-template-columns:1fr;gap:2.5rem clamp(3rem, 4.5vw, 4rem);padding:clamp(3rem, 8vw, 6rem) var(--gutter)}
@media (min-width:900px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
.summary div{padding-top:1rem;display:grid;gap:.6rem;align-content:start}
.summary h2{font-family:var(--mono);font-size:.875rem;font-weight:400;letter-spacing:0;color:var(--wine)}
.summary p{font-size:1.125rem;letter-spacing:-.02em;line-height:1.3}
.z-body{padding-bottom:clamp(4rem, 10vw, 7rem)}
.figures{display:grid;grid-template-columns:1fr;gap:2.5rem 2rem;padding:clamp(3rem, 7vw, 5.5rem) var(--gutter);background:var(--ink)}
@media (min-width:800px){.figures{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fig .v{font-size:clamp(3rem, 2rem + 4vw, 6rem);font-weight:300;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;color:#FFFFFF}
.fig.start .v{color:#A3A3A3}
.fig.hi .v{color:var(--lime)}
.fig .l{color:#A3A3A3;margin-top:.5rem}
.case-grid{display:grid;grid-template-columns:1fr;gap:2.5rem;padding:clamp(4rem, 10vw, 7rem) var(--gutter) 0}
@media (min-width:1024px){.case-grid{grid-template-columns:200px minmax(0,1fr);gap:clamp(3rem, 6vw, 6rem)}}
.toc{align-self:start}
@media (min-width:1024px){.toc{position:sticky;top:6rem}}
.toc summary{font-family:var(--mono);font-size:.875rem;min-height:44px;display:flex;align-items:center;cursor:pointer;border-top:1px solid var(--zline)}
@media (min-width:1024px){.toc summary{pointer-events:none;list-style:none}.toc summary::-webkit-details-marker{display:none}}
.toc ol{list-style:none;padding:0;margin:0}
.toc button{display:flex;gap:.6rem;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:.4rem 0;min-height:36px;align-items:center;font-size:.9375rem;color:var(--zmuted);transition:color .25s}
.toc button .n{font-family:var(--mono);font-size:.8125rem;width:1.6rem;flex:none;position:relative;isolation:isolate;transition:color .25s}
.toc button .n::before{content:"";position:absolute;z-index:-1;left:-.3em;width:calc(2ch + .15em);top:-.15em;bottom:.1em;background:var(--lime);clip-path:inset(0 100% 0 0);transition:clip-path .35s var(--ease)}
.toc button:hover .n::before,.toc button:focus-visible .n::before,.toc button[aria-current="true"] .n::before{clip-path:inset(0)}
.toc button:hover .n,.toc button:focus-visible .n,.toc button[aria-current="true"] .n{color:#0A0A0A}
.toc button::after{content:"";height:2px;flex:0 0 0;background:var(--ink);transition:flex-basis .5s var(--ease);margin-left:auto}
.toc button:hover,.toc button[aria-current="true"]{color:var(--zfg)}
.toc button[aria-current="true"]::after{flex-basis:1.25rem}
.sections{display:grid;gap:clamp(4.5rem, 10vw, 8rem);min-width:0}
.sec{display:grid;gap:1.5rem;scroll-margin-top:6rem}
.sec .k{color:var(--wine)}
.sec h2{font-size:clamp(2rem, 1.4rem + 2.4vw, 3.5rem);line-height:1;letter-spacing:-.04em}
.rows{list-style:none;margin:0;padding:0;counter-reset:r}
.rows li{counter-increment:r;display:grid;grid-template-columns:3rem minmax(0,1fr);gap:1rem;padding:1rem 0;border-top:1px solid var(--zrule)}
.rows li:last-child{border-bottom:1px solid var(--zrule)}
.rows li::before{content:"0" counter(r);font-family:var(--mono);font-size:.875rem;color:var(--zmuted);padding-top:.2rem}
.cols{display:grid;gap:1.5rem 2rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.cols > div{border-top:1px solid var(--zrule);padding-top:.9rem;display:grid;gap:.4rem;align-content:start}
.cols h3{font-size:1.25rem;letter-spacing:-.025em;line-height:1.15}
.cols p{color:var(--zmuted)}
.cols .n{font-family:var(--mono);font-size:.875rem;color:var(--zmuted)}
.cols.flat{gap:2.5rem 3rem}
.cols.flat > div{border-top:0;padding-top:0}
/* Pausa visual: bloque bordó dentro de la columna de contenido */
.sec.pause{background:var(--wine);color:#FFFFFF;padding:clamp(2rem, 5vw, 4rem) clamp(1.25rem, 4vw, 3.5rem)}
.sec.pause .k,.sec.pause h2,.sec.pause h3{color:#FFFFFF}
.sec.pause .cols p{color:rgba(255,255,255,.86)}
.sec.pause .cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.say{font-size:clamp(1.5rem, 1.1rem + 1.6vw, 2.5rem);line-height:1.12;letter-spacing:-.03em;font-weight:600;max-width:26ch}
.say em{font-style:normal;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
figure{margin:0}
figure .ph{aspect-ratio:16/9}
figcaption{color:var(--zmuted);margin-top:.75rem;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:0}
/* Bloques por etapa: imagen y texto en zigzag en desktop, imagen arriba en mobile */
.stage{display:grid;gap:1.5rem;align-items:start}
.stage .ph{aspect-ratio:4/3}
.stage-text{display:grid;gap:1rem;align-content:start}
.stage-text .n{color:var(--zmuted)}
@media (min-width:900px){.stage{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(2rem, 4vw, 3.5rem)}.stage.rev .ph{order:2}}
.plain{margin:0;padding-left:1.2em;display:grid;gap:.35rem}
.next{padding:clamp(3.5rem, 8vw, 6rem) var(--gutter);display:grid;gap:.75rem}
.next .row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--zmuted);border-top:1px solid var(--zline);padding-top:1rem}
.next .t{font-size:clamp(2.4rem, 1.4rem + 4.2vw, 5.5rem);font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--zmuted)}


::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

// Cada columna repite su lista tres veces para que el recorrido no tenga corte. Al arrancar queda centrado el primero: la gráfica violeta en el medio.
const GCOLS = [['a','b','c','v'],['v','a','b','c'],['b','c','v','a']];
function ganim(){
  const cols = GCOLS.map(seq=>`<div class="ganim-col"><div class="ganim-track">${[...seq,...seq,...seq].map(k=>`<img src="${GIMG[k]}" alt="" draggable="false" width="720" height="1600">`).join('')}</div></div>`).join('');
  return `<div class="ganim" role="img" aria-label="Pantallas del flujo de Garantía Premium (carrito, modal de garantía y ¿Qué cubre?) en columnas que se desplazan sobre el violeta de Frávega"><div class="ganim-grid">${cols}</div></div>`;
}

function words(text){ return text.split(' ').map(w=>`<span class="w">${w}</span>`).join(' '); }

function home(){
  const feats = FEATURED.map(f=>{
    const inner = `
      <div class="feature-head">
        <h3 class="feature-title"><span class="num"><span>${f.n}</span></span><span class="t">${f.title}</span></h3>
        <div class="feature-sub"><p class="feature-line">${f.line}</p><p class="feature-meta mono">${f.client} / ${f.area}</p></div>
      </div>
      ${f.anim ? ganim() : ph(f.tone,f.fg,'Imagen del caso '+f.title+', próximamente')}`;
    const card = f.ready ? `<a class="feature" href="#${f.id}" id="card-${f.id}">${inner}</a>` : `<div class="feature">${inner}</div>`;
    return f.anim ? `<div class="feature-wrap">${card}<button class="ganim-pause" type="button" aria-pressed="false"><span class="gp-i" aria-hidden="true"></span><span class="vh">Pausar animación</span></button></div>` : card;
  }).join('');
  const more = MORE.map(m=>`<li class="rv" data-tone="${m.tone}" data-fg="${m.fg}"><span class="mono muted">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.client}</span><span class="s"><span class="tag">Próximamente</span></span></li>`).join('');
  return `<div class="view">
    <section class="hero zone z-hero" aria-labelledby="home-title">
      <div class="hero-left">
        <h1 id="home-title" class="mega-space"><span>Mora</span><span>Voltés</span></h1>
        <div class="hero-intro">
          <div class="hero-copy"><span class="hero-loc">Buenos Aires / Argentina</span>
          <p>Senior Product Designer especializada en checkout y pagos, con más de 15 años de oficio como diseñadora gráfica.</p></div>
          <a class="acc" href="#proyectos" data-scroll="proyectos"><span class="acc-t">Proyectos</span><span class="acc-a a-dn" aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="hero-right" aria-hidden="true"></div>
    </section>

    <section class="statement zone z-statement" aria-label="Cómo trabajo">
      <p data-words>${words('Mi formación gráfica me enseñó que lo que no se entiende no funciona. Hoy convierto problemas reales en experiencias de compra confiables.')}</p>
    </section>

    <section id="proyectos" aria-labelledby="proj-title" tabindex="-1">
      <div class="zone z-work"><div class="label-row"><h2 id="proj-title">Proyectos seleccionados</h2></div>
      ${feats}
      </div><div class="zone z-more"><div class="label-row"><h2>Más proyectos</h2></div>
      <ul class="list" aria-label="Más proyectos">${more}</ul></div>
      <div class="zone z-graphic">
        <a class="gbanner" href="https://www.behance.net/moravoltes" target="_blank" rel="noopener">
          <div class="gbanner-img">${ph('#5E5E5C','#F2F2F0','Pieza de diseño gráfico de Mora, imagen próximamente')}</div>
          <div class="gbanner-text">
            <span class="gbanner-label">Diseño gráfico</span>
            <p class="gbanner-big"><span class="ln">Quince años</span><span class="ln">de oficio gráfico.</span></p>
            <p class="gbanner-sub">Identidad, editorial y comunicación visual para marcas, medios y organismos públicos.</p>
            <span class="gbanner-link acc"><span class="acc-t">Ver proyectos en Behance</span><span class="acc-a a-ne" aria-hidden="true">↗</span><span class="vh"> (se abre en otra pestaña)</span></span>
          </div>
        </a>
      </div>
    </section>

    <section id="sobre" class="zone z-exp" aria-labelledby="exp-title" tabindex="-1">
      <div class="label-row"><h2 id="exp-title">Recorrido</h2></div>
      <ol class="exp">

/* ---------- Motor ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce) document.documentElement.classList.add('js-motion');
const main = document.getElementById('contenido');
const mega = document.getElementById('mega');
let route = '', firstLoad = true, io;

function megaSmall(){ const fs = parseFloat(getComputedStyle(mega).fontSize); return 17/fs; }
const logo = document.getElementById('logo');
function megaDx(){ const h=main.querySelector('.hero'); if(!h) return 0; return Math.max(0, parseFloat(getComputedStyle(h).paddingLeft) - parseFloat(getComputedStyle(mega).left)); }
function megaT(s){ const sm=megaSmall(); const q = sm<1 ? Math.min(1,Math.max(0,(1-s)/(1-sm))) : 0; return `translateX(${(megaDx()*(1-q)).toFixed(1)}px) scale(${s})`; }
function setMega(s){ mega.style.transform = megaT(s); const docked = s <= megaSmall()*1.2; mega.classList.toggle('gone', docked); logo.classList.toggle('show', docked); }

function render(){
  const id = (location.hash||'#inicio').slice(1);
  const isCase = !!CASES[id];
  const swap = ()=>{
    route = isCase ? 'case' : 'home';
    main.innerHTML = (isCase ? casePage(id) : home()) + CONTACT;
    document.title = isCase ? CASES[id].title+' · Mora Voltés' : 'Mora Voltés · Senior Product Designer';
    document.querySelectorAll('[data-nav]').forEach(a=> route==='home' ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
    closeMenu();
    if(!isCase && window.__from){ const c=document.getElementById('card-'+window.__from); window.__from=null; if(c){ c.scrollIntoView({block:'center'}); c.focus({preventScroll:true}); } }
    else { window.scrollTo(0,0); if(isCase) document.getElementById('case-title').focus({preventScroll:true}); }
    if(isCase) window.__from = id;
    setup();
    // Entrada del nombre: chico → grande (solo inicio)
    if(route==='home' && !reduce && scrollY < 10){
      mega.classList.remove('intro'); mega.style.transform=megaT(megaSmall()); mega.classList.remove('gone'); logo.classList.remove('show');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ mega.classList.add('intro'); mega.style.transform=megaT(1); setTimeout(()=>{ mega.classList.remove('intro'); tick(); },1300); }));
    } else tick();
    const pt = main.querySelector('.portrait.start');
    if(pt) requestAnimationFrame(()=>requestAnimationFrame(()=>pt.classList.remove('start')));
  };
  if(document.startViewTransition && !reduce && !firstLoad) document.startViewTransition(swap); else swap();
  firstLoad = false;
}

function setup(){
  // Revelar al entrar
  io && io.disconnect();
  const targets = main.querySelectorAll('.rv, .feature .ph, .feature .ganim, [data-count], .gbanner');
  if(reduce || !('IntersectionObserver' in window)){ targets.forEach(t=>t.classList.add('in')); }
  else {
    io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); if(e.target.dataset.count) countUp(e.target); io.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px'});
    targets.forEach(t=>io.observe(t));
  }
  // Tarjeta animada: se frena fuera de pantalla y tiene botón para pausar
  main.querySelectorAll('.feature-wrap').forEach(w=>{
    const g = w.querySelector('.ganim'), b = w.querySelector('.ganim-pause');
    if('IntersectionObserver' in window) new IntersectionObserver(es=>es.forEach(e=>g.classList.toggle('off',!e.isIntersecting))).observe(g);
    b.addEventListener('click',()=>{ const p = g.classList.toggle('paused'); b.setAttribute('aria-pressed',String(p)); b.querySelector('.vh').textContent = p ? 'Reanudar animación' : 'Pausar animación'; });
  });
  // Tarjeta destacada activa cuando está en el centro de la pantalla
  const feats = main.querySelectorAll('.feature');
  if(feats.length && 'IntersectionObserver' in window){
    const fo = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ feats.forEach(f=>f.classList.toggle('on', f===e.target)); } else e.target.classList.remove('on'); }),{rootMargin:'-45% 0px -45% 0px'});
    feats.forEach(f=>fo.observe(f));
  }
  // Lista con vista previa
  const pv = document.getElementById('preview');
  main.querySelectorAll('.list li').forEach(li=>{
    li.addEventListener('mouseenter',()=>{ pv.style.setProperty('--tone',li.dataset.tone); pv.style.setProperty('--tone-fg',li.dataset.fg); pv.classList.add('show'); });
    li.addEventListener('mouseleave',()=>pv.classList.remove('show'));
    li.addEventListener('mousemove',e=>{ pv.style.left=e.clientX+'px'; pv.style.top=e.clientY+'px'; });
  });
  // Scroll suave a anclas internas
  main.querySelectorAll('[data-scroll]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const t=document.getElementById(a.dataset.scroll); t.scrollIntoView({behavior:reduce?'auto':'smooth'}); t.focus({preventScroll:true}); }));
  // Índice del caso
  const tb = main.querySelectorAll('.toc button');
  tb.forEach(b=>b.addEventListener('click',()=>{ const s=document.getElementById('s-'+b.dataset.to); s.scrollIntoView({behavior:reduce?'auto':'smooth'}); const h=s.querySelector('h2'); h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }));
  if(tb.length && 'IntersectionObserver' in window){
    const so = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.id.slice(2); tb.forEach(b=>b.setAttribute('aria-current', String(b.dataset.to===id))); } }),{rootMargin:'-35% 0px -60% 0px'});
    main.querySelectorAll('.sec').forEach(s=>so.observe(s));
  }
}

function countUp(el){
  if(reduce) return;
  const end = parseFloat(el.dataset.count), t0 = performance.now(), dur = 1400;
  const step = now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); el.textContent=(end*e).toFixed((el.dataset.count.split('.')[1]||'').length).replace('.',',')+'\u00a0%'; if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// Animaciones ligadas al scroll
function tick(){
  const vh = innerHeight;
  if(!mega.classList.contains('intro')){
    if(route==='case' || reduce && route!=='home') setMega(megaSmall());
    else { const p = Math.min(1, scrollY/(vh*.55)); const s = 1 + (megaSmall()-1)*(1-Math.pow(1-p,2)); setMega(reduce ? (scrollY>vh*.3?megaSmall():1) : s); }
  }
  document.getElementById('bar').classList.toggle('on', route==='case' || scrollY > innerHeight*.4);
  if(reduce) return;
  // Texto que se oscurece palabra por palabra
  main.querySelectorAll('[data-words]').forEach(p=>{
    const r = p.getBoundingClientRect(); const prog = Math.min(1, Math.max(0, (vh*.85 - r.top)/(vh*.6 + r.height*.3)));
    const ws = p.querySelectorAll('.w'); const on = Math.round(prog*ws.length);
    ws.forEach((w,i)=>w.classList.toggle('on', i<on));
  });
  // Columnas de la tarjeta animada: se separan un poco con el scroll, en sentidos opuestos
  main.querySelectorAll('.ganim').forEach(g=>{
    if(g.classList.contains('paused')) return;
    const r = g.getBoundingClientRect(); if(r.bottom<0||r.top>vh) return;
    const p = (r.top + r.height/2 - vh/2) / vh;
    g.querySelectorAll('.ganim-col').forEach((c,i)=> c.style.setProperty('--sy', (p * (i%2 ? 1 : -1) * r.height * .10).toFixed(1)+'px'));
  });
  // Parallax suave dentro de las imágenes
  main.querySelectorAll('.ph').forEach(el=>{
    const r = el.getBoundingClientRect(); if(r.bottom<0||r.top>vh) return;
    const prog = 1 - (r.top + r.height)/(vh + r.height); el.style.setProperty('--z', (1.14 - prog*.12).toFixed(3));
  });
  // «Hablemos» crece al llegar
  const g = main.querySelector('[data-grow]');
  if(g){ const r=g.getBoundingClientRect(); const prog=Math.min(1,Math.max(0,(vh - r.top)/(vh*.7))); g.style.transform=`scale(${(.55+.45*(1-Math.pow(1-prog,3))).toFixed(3)})`; }
}
let ticking=false;
addEventListener('scroll',()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ tick(); ticking=false; }); } },{passive:true});
addEventListener('resize',tick);
if(reduce) document.querySelectorAll('.statement .w').forEach(w=>w.classList.add('on'));

/* ---------- Menú ---------- */
const menu = document.getElementById('menu'), mt = menu.querySelector('.menu-toggle');
mt.addEventListener('click',()=>{ const o = menu.classList.toggle('open'); mt.setAttribute('aria-expanded',String(o)); mt.setAttribute('aria-label', o?'Cerrar menú':'Abrir menú'); if(o) menu.querySelector('nav button').focus(); });
function closeMenu(){ menu.classList.remove('open'); mt.setAttribute('aria-expanded','false'); mt.setAttribute('aria-label','Abrir menú'); }
addEventListener('keydown',e=>{ if(e.key==='Escape' && menu.classList.contains('open')){ closeMenu(); mt.focus(); } });
menu.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  const go = ()=>{ const t=document.getElementById(b.dataset.go); t.scrollIntoView({behavior:reduce?'auto':'smooth'}); t.focus({preventScroll:true}); closeMenu(); };
  if(route!=='home' && b.dataset.go!=='contacto'){ location.hash='#inicio'; setTimeout(go,450); } else go();
}));



addEventListener('hashchange',render);
render();
if(reduce) document.querySelectorAll('.statement .w').forEach(w=>w.classList.add('on'));
</script>
</body>
